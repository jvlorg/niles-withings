id = "withings"
name = "Withings"
version = "0.1.0-alpha.8"
authors = ["Johan Volmers Leth"]
description = "Withings Sleep bed-presence status and account callbacks."
keywords = ["withings", "bed", "sleep", "presence"]
min_niles = "0.3.0"
interface = "0.3"

[permissions]
devices = true
tools = true
ui = true
callback = true
webhook = true
http = ["account.withings.com", "wbsapi.withings.net"]

# Retained because Niles rejects config.get for undeclared settings. Existing
# explicit restrictions must not silently disappear during this migration.
[[settings]]
key = "user_id"
label = "Legacy account restriction (normally leave blank)"
type = "string"
required = false

[[settings]]
key = "room"
label = "Bed room"
type = "room"
required = true

[[settings]]
key = "client_id"
label = "Withings Client ID"
type = "string"
required = true

[[settings]]
key = "client_secret"
label = "Withings Client Secret"
type = "secret"
required = true

[[ui.menu]]
id = "withings"
label = "Withings"
icon = "bed"
